name: Publish Image

# Publishes the runnable test server to the GitHub Container Registry.
#
# Consumers pin an exact version - `ghcr.io/odata2ts/test-server-asp-net:0.2.1` - and start it as a
# throwaway container; see odata2ts/odata2ts, int-test/asp-net. `latest` is still republished from every
# push to main for ad-hoc use, but nothing automated consumes it any more.
#
# release-please runs as a job here rather than this workflow being triggered by the tag it pushes:
# GitHub does not start workflows from events made with GITHUB_TOKEN, so that tag would build nothing.
#
# A release is built once, while its release PR is open, and merging only re-tags it:
#
#   release PR opens -> `build` pushes the image as `:rc`, labelled with the version being released
#   release PR merges -> `promote` re-tags that very manifest as 0.2.1 / 0.2 / 0 / latest / main / sha-*
#
# `promote` moves no layers - `imagetools create` copies the manifest registry-side - so publishing is a
# few seconds rather than a full build, and what ships is the artifact the release PR already smoke-tested.
# A single fixed `:rc` tag rather than one per version, because GITHUB_TOKEN cannot delete GHCR package
# versions and only one release PR is ever open at a time; `promote` checks the candidate's version label
# to be sure the tag holds the release it is about to publish.

# The branch is not pinned by name on purpose. A hardcoded name means the workflow silently stops
# firing the day the default branch is renamed - which is exactly what happened here, the default was
# `feat/library-test-model` until recently. Instead every push arrives and the job itself decides, by
# comparing against the repository's actual default branch - see the `if:` below.
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # a newer commit on main makes an in-flight publish pointless
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Opens and maintains the release PR; merging that PR makes the next run of this job cut the release
  # and hand the version to `publish` below. Runs on the default branch only, so on every other branch
  # it is skipped - which is why `publish` tests `result != 'failure'` instead of relying on `needs:`
  # alone, a skipped dependency would otherwise skip the publish too.
  release:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release-please reads the whole history to work out the next version

      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Builds and pushes the image: from the default branch as `latest`/`main`/`sha-*`, and from an open
  # release PR as `:rc`. Not on a release merge - `promote` re-tags the candidate instead of rebuilding.
  #
  # On a pull request this builds the *merge ref*, main with the PR applied, which is exactly what the
  # squash merge will produce - so the candidate is the release, not an approximation of it.
  build:
    needs: release
    # Feature branches skip immediately; so does the release merge, which promotes instead.
    if: >-
      !cancelled() && needs.release.result != 'failure' &&
      needs.release.outputs.released != 'true' &&
      (github.ref_name == github.event.repository.default_branch ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The version this image will be published as, read from the release PR's own manifest. That file
      # is the one release-please updates whatever the release-type is, so this works unchanged in the
      # sibling server repos. Empty outside a release PR, which leaves the label at its default.
      - name: Read the version being released
        id: version
        if: startsWith(github.head_ref, 'release-please--')
        run: echo "version=$(jq -r '.["."]' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # A release PR yields the single `:rc` tag and nothing else; the default branch yields
          # `main`, `sha-*` and `latest`. The version tags are not made here at all - `promote` puts
          # them on this very manifest once the release PR is merged.
          tags: |
            type=raw,value=rc,enable=${{ startsWith(github.head_ref, 'release-please--') }}
            type=ref,event=branch,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
          # `promote` copies the manifest as it is, so the labels the candidate carries are the ones the
          # released image ends up with - hence the real version here instead of metadata-action's
          # default, which would say "rc". Blank outside a release PR, and an empty line is ignored.
          labels: |
            ${{ steps.version.outputs.version && format('org.opencontainers.image.version={0}', steps.version.outputs.version) || '' }}

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: test-server-asp-net:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A published image that does not actually serve the model is worse than none, so the image is
      # smoke-tested before it is pushed - including one operation, since routing those is where an
      # ASP.NET Core OData service breaks first.
      - name: Smoke-test the image
        run: |
          docker run -d --name verify -p 4004:4004 test-server-asp-net:verify
          for i in $(seq 1 60); do
            curl -sfS http://localhost:4004/odata/v4/library/ > /dev/null && break
            sleep 2
          done
          curl -sfS 'http://localhost:4004/odata/v4/library/$metadata' > /dev/null
          curl -sfS 'http://localhost:4004/odata/v4/library/Media?$top=1' > /dev/null
          count=$(curl -sfS 'http://localhost:4004/odata/v4/library/TotalMediaCount()' | grep -o '"value":[0-9]*')
          echo "TotalMediaCount -> $count"
          test -n "$count"
          docker rm -f verify

      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # The release itself: re-tag the candidate the release PR already built and smoke-tested. No build, no
  # layer transfer - `imagetools create` copies the manifest inside the registry.
  promote:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the release candidate
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"

          # The candidate is a moving tag, so make sure it holds this release and not a stale build -
          # main moving while the release PR was open makes release-please regenerate the branch, and a
          # merge racing that rebuild would otherwise publish the wrong bits. Read registry-side, so
          # nothing is pulled.
          built=$(docker buildx imagetools inspect "$IMAGE:rc" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.version" }}')
          if [ "$built" != "$version" ]; then
            echo "::error::The release candidate is built for $built, but $version is being released."
            exit 1
          fi

          major="${version%%.*}"
          minor="${version#*.}"
          minor="${minor%%.*}"

          docker buildx imagetools create \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:$major.$minor" \
            --tag "$IMAGE:$major" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:main" \
            --tag "$IMAGE:sha-$(echo "$GITHUB_SHA" | cut -c1-7)" \
            "$IMAGE:rc"

          echo "Published $version from the candidate." >> "$GITHUB_STEP_SUMMARY"

  # Tells odata2ts to raise its pin. A push rather than odata2ts polling, so the PR exists within seconds
  # of the release - and it has to come from the app rather than GITHUB_TOKEN, or the integration tests
  # would never run on the PR it opens, which is the entire point of opening one.
  notify-odata2ts:
    needs: [release, promote]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.ODATA2TS_PR_BOT_APP_ID }}
          private-key: ${{ secrets.ODATA2TS_PR_BOT_PRIVATE_KEY }}
          owner: odata2ts
          repositories: odata2ts

      - name: Ask odata2ts to run against the new server
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh api repos/odata2ts/odata2ts/dispatches \
            --field event_type=test-server-released \
            --field 'client_payload[server]=asp-net' \
            --field "client_payload[version]=${TAG_NAME#v}"
